name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # потрібна повна історія для підрахунку коммітів (MINOR)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          # Схема MAJOR.MINOR: MAJOR з version.py (вручну), MINOR = кількість коммітів
          $major = python -c "import version; print(version.MAJOR)"
          $minor = git rev-list --count HEAD
          $ver = "$major.$minor"
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $ver (major=$major, commits=$minor)"

      - name: Bake version into build
        shell: pwsh
        run: |
          $major = python -c "import version; print(version.MAJOR)"
          "MAJOR = $major"                                   | Out-File -FilePath version.py -Encoding utf8
          '__version__ = "${{ steps.ver.outputs.version }}"' | Out-File -FilePath version.py -Append -Encoding utf8
          Get-Content version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pyinstaller pyinstaller-hooks-contrib

      - name: Generate app icon
        shell: pwsh
        run: python -c "from web import icon; print(icon.make_ico('farmwatch.ico'))"

      - name: Build console exe (bot)
        run: >
          pyinstaller --onefile --console
          --name "farmwatch-${{ steps.ver.outputs.version }}"
          --icon farmwatch.ico
          --collect-submodules telegram
          telegram_bot.py

      - name: Build GUI exe (tray panel)
        continue-on-error: true
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          pyinstaller --onefile --windowed `
            --name "farmwatch-gui-$ver" `
            --icon farmwatch.ico `
            --paths . `
            --add-data "web/static;web/static" `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --collect-all pystray `
            --hidden-import clr `
            --hidden-import clr_loader `
            --hidden-import pystray._win32 `
            --hidden-import PIL `
            --collect-submodules uvicorn `
            --hidden-import uvicorn `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import uvicorn.lifespan.off `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.loops.asyncio `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.http.h11_impl `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.protocols.websockets.websockets_impl `
            --hidden-import uvicorn.protocols.websockets.wsproto_impl `
            --copy-metadata uvicorn `
            --copy-metadata fastapi `
            --exclude-module PyQt5 `
            --exclude-module PyQt6 `
            --exclude-module gi `
            web/gui.py

      - name: Assemble portable package
        id: pkg
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "farmwatch-$ver-windows.zip"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/farmwatch-$ver.exe" release/                              # console bot
          if (Test-Path "dist/farmwatch-gui-$ver.exe") {
            Copy-Item "dist/farmwatch-gui-$ver.exe" release/                         # tray panel
            Write-Host "GUI exe included"
          } else {
            Write-Host "GUI exe was not built (skipping)"
          }
          Copy-Item config.example.json release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmwatch-${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}

      - name: Publish release (on push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $tag = "v$ver"

          # Короткий опис релізу = повідомлення останнього коміту (subject + body)
          $subject = git log -1 --pretty=format:"%s"
          $body    = git log -1 --pretty=format:"%b"
          $notes   = $subject
          if ($body -and $body.Trim()) { $notes = "$subject`n`n$body" }
          $sha7 = $env:GITHUB_SHA.Substring(0, 7)
          $notes = "$notes`n`nВерсія $ver · коміт $sha7"
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8

          # Кожен коміт -> власний реліз v<ver>, попередні лишаються. Найновіший = latest.
          $exists = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$zip" --clobber
            gh release edit $tag --title "farmwatch $ver" --notes-file release_notes.md --latest
          } else {
            gh release create $tag "$zip" `
              --title "farmwatch $ver" `
              --notes-file release_notes.md `
              --latest `
              --target $env:GITHUB_SHA
          }
