name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable exe
        run: >
          pyinstaller --onefile --console
          --name bambu-telegram-bot
          --collect-submodules telegram
          telegram_bot.py

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/bambu-telegram-bot.exe release/
          Copy-Item config.example.json release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath bambu-telegram-bot-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bambu-telegram-bot-windows
          path: bambu-telegram-bot-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bambu-telegram-bot-windows.zip
