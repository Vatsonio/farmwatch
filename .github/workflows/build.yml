name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $codeVer = python -c "import version; print(version.__version__)"
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tagVer = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
            if ($tagVer -ne $codeVer) {
              throw "Tag v$tagVer != version.py ($codeVer). Bump version.py before tagging."
            }
            $ver = $codeVer
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $ver = "$codeVer-dev.$shortSha"
          }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building version: $ver"

      - name: Bake version into build
        shell: pwsh
        run: |
          "__version__ = '${{ steps.ver.outputs.version }}'" | Out-File -FilePath version.py -Encoding utf8
          Get-Content version.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable exe
        run: >
          pyinstaller --onefile --console
          --name "farmwatch-${{ steps.ver.outputs.version }}"
          --collect-submodules telegram
          telegram_bot.py

      - name: Assemble portable package
        id: pkg
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "farmwatch-$ver-windows.zip"
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist/farmwatch-$ver.exe" release/
          Copy-Item config.example.json release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath $zip -Force
          "zip=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmwatch-${{ steps.ver.outputs.version }}
          path: ${{ steps.pkg.outputs.zip }}

      - name: Publish versioned release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: farmwatch ${{ steps.ver.outputs.version }}
          files: ${{ steps.pkg.outputs.zip }}

      - name: Update rolling "latest" prerelease (on push to main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest "${{ steps.pkg.outputs.zip }}" `
            --prerelease `
            --title "Latest build - ${{ steps.ver.outputs.version }}" `
            --notes "Автоматична збірка з гілки main. Версія: ${{ steps.ver.outputs.version }}, коміт: $env:GITHUB_SHA"
