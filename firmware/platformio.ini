; Прошивка ESP32-C3 SuperMini для матриці 8x8 (MAX7219).
; Дані приходять від farmwatch по USB serial (native USB CDC).

[env:esp32-c3]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200

; native USB CDC, щоб Serial ходив по тому ж USB кабелю
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    majicdesigns/MD_MAX72XX @ ^3.5.1
